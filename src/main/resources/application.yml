server:
  port: ${APP_PORT}
  address: ${APP_ADDRESS}

spring:
  application:
    name: GenderHealthCare

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}

  # Kept temporarily for the legacy service wiring. It will be removed as
  # services move to constructor injection in later refactor phases.
  main:
    allow-circular-references: ${SPRING_ALLOW_CIRCULAR_REFERENCES}

  cache:
    type: caffeine

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS}

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

jwt:
  secret: ${JWT_SECRET}

payos:
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}
  api-base-url: ${PAYOS_API_BASE_URL}
  return-url: ${PAYOS_RETURN_URL}
  cancel-url: ${PAYOS_CANCEL_URL}
  webhook-url: ${PAYOS_WEBHOOK_URL}
  connect-timeout-seconds: ${PAYOS_CONNECT_TIMEOUT_SECONDS}
  read-timeout-seconds: ${PAYOS_READ_TIMEOUT_SECONDS}

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}

zoom:
  client-id: ${ZOOM_CLIENT_ID}
  client-secret: ${ZOOM_CLIENT_SECRET}
  account-id: ${ZOOM_ACCOUNT_ID}

logging:
  level:
    org.springframework.beans.factory: INFO

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
