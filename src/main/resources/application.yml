server:
  port: ${APP_PORT:8085}
  address: ${APP_ADDRESS:0.0.0.0}

spring:
  application:
    name: ${APP_NAME:GenderHealthCare}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

  # Kept temporarily for the legacy service wiring. It will be removed as
  # services move to constructor injection in later refactor phases.
  main:
    allow-circular-references: ${SPRING_ALLOW_CIRCULAR_REFERENCES:true}

  cache:
    type: ${CACHE_TYPE:caffeine}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:15MB}

jwt:
  secret: ${JWT_SECRET}

google:
  client:
    id: ${GOOGLE_CLIENT_ID}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  pay-url: ${VNPAY_PAY_URL}
  return-url: ${VNPAY_RETURN_URL}
  ipn-url: ${VNPAY_IPN_URL}

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}

zoom:
  client-id: ${ZOOM_CLIENT_ID}
  client-secret: ${ZOOM_CLIENT_SECRET}
  account-id: ${ZOOM_ACCOUNT_ID}

logging:
  level:
    org.springframework.beans.factory: ${SPRING_BEANS_LOG_LEVEL:INFO}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
