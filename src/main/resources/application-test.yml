spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:gender_healthcare_test;MODE=MySQL;NON_KEYWORDS=USER,VALUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  main:
    allow-circular-references: true

  mail:
    host: localhost
    port: 2525
    username: test@example.com
    password: test-password

jwt:
  secret: test-only-jwt-secret-key-with-at-least-32-characters

google:
  client:
    id: test-google-client-id

vnpay:
  tmn-code: TEST_TMN
  hash-secret: test-vnpay-secret
  pay-url: https://example.test/vnpay
  return-url: http://localhost:8085/api/payment/vnpay/vnpay-return
  ipn-url: http://localhost:8085/api/payment/vnpay/vnpay-ipn

cloudinary:
  cloud_name: test-cloud
  api_key: test-key
  api_secret: test-secret

zoom:
  client-id: test-zoom-client
  client-secret: test-zoom-secret
  account-id: test-zoom-account

cors:
  allowed-origins: http://localhost:5173
