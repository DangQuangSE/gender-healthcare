name: gender-healthcare

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-genderhealthcare}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      APP_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://database:3306/${DB_NAME:-genderhealthcare}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    expose:
      - "8085"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:8085/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    networks:
      - app_network

  frontend:
    build:
      context: ../gender-healthcare-fe
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WEBSOCKET_URL: ${VITE_WEBSOCKET_URL:-/ws/chat}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
