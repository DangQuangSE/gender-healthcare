name: Deploy backend to Oracle VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s-health-backend-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
  ARCHIVE_PATH: /tmp/s-health-backend.tgz
  ARCHIVE_NAME: s-health-backend.tgz
  PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}

jobs:
  validate-config:
    name: Validate CI/CD variables
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check required variables
        env:
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          for key in VPS_DEPLOY_PATH PUBLIC_API_URL; do
            if [ -z "${!key}" ]; then
              echo "::error::GitHub Actions variable $key is required."
              exit 1
            fi
          done

  build:
    name: Build backend
    needs: validate-config
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application
        run: |
          set -euo pipefail
          chmod +x mvnw
          ./mvnw -B -DskipTests package

      - name: Create release archive
        run: |
          set -euo pipefail
          tar \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./target' \
            --exclude='./.codex' \
            -czf "$ARCHIVE_PATH" .
          cp "$ARCHIVE_PATH" "$ARCHIVE_NAME"

      - name: Store release artifact
        uses: actions/upload-artifact@v4
        with:
          name: s-health-backend
          path: s-health-backend.tgz
          if-no-files-found: error
          retention-days: 1

  docker-build:
    name: Validate Docker image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: s-health-backend:ci
          load: true
          push: false

  deploy:
    name: Deploy to Oracle VPS
    needs:
      - build
      - docker-build
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: s-health-backend

      - name: Check release artifact
        run: test -s "$ARCHIVE_NAME"

      - name: Load Oracle SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

      - name: Configure SSH host key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p 22 -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release archive
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          cat "$ARCHIVE_NAME" | ssh -p 22 "$ORACLE_USER@$ORACLE_HOST" \
            "cat > '$ARCHIVE_PATH'"

      - name: Rebuild and restart VPS stack
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -p 22 "$ORACLE_USER@$ORACLE_HOST" \
            "RELEASE_SHA='$RELEASE_SHA' DEPLOY_PATH='$DEPLOY_PATH' ARCHIVE_PATH='$ARCHIVE_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          current="${DEPLOY_PATH:?DEPLOY_PATH is required}"
          release="${DEPLOY_PATH}.release"
          archive="${ARCHIVE_PATH:?ARCHIVE_PATH is required}"
          new_compose="${release}/deploy/docker-compose.vps.yml"
          required_env_file="${release}/deploy/required-env.list"

          cleanup_failed_release() {
            rm -rf "$release" "$archive"
          }
          trap cleanup_failed_release EXIT

          test -s "$current/.env"
          rm -rf "$release"
          mkdir -p "$release"
          tar -xzf "$archive" -C "$release"
          cp "$current/.env" "$release/.env"
          chmod 600 "$release/.env"
          test -f "$new_compose"
          test -f "$required_env_file"

          while IFS= read -r key; do
            case "$key" in
              ''|\#*) continue ;;
            esac

            if ! grep -Eq "^${key}=[^[:space:]].*$" "$release/.env"; then
              echo "Required runtime variable is missing or empty: $key" >&2
              exit 1
            fi
          done < "$required_env_file"

          compose=(docker compose --project-name s-health --env-file "$release/.env" -f "$new_compose")
          "${compose[@]}" config --quiet
          migration_script="${release}/deploy/run-migrations.sh"
          test -f "$migration_script"

          "${compose[@]}" up -d database
          database_healthy=false
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' s_health_mysql)" = healthy ]; then
              database_healthy=true
              break
            fi
            sleep 2
          done

          if [ "$database_healthy" != true ]; then
            "${compose[@]}" ps >&2 || true
            "${compose[@]}" logs --tail=100 database >&2 || true
            echo 'Database health check failed before migrations.' >&2
            exit 1
          fi

          bash "$migration_script" "$release/.env"
          "${compose[@]}" up -d --build --remove-orphans

          healthy=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:8086/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 4
          done

          if [ "$healthy" != true ]; then
            "${compose[@]}" ps >&2 || true
            "${compose[@]}" logs --tail=100 backend database >&2 || true

            if [ -f "$current/deploy/docker-compose.vps.yml" ]; then
              old_compose="$current/deploy/docker-compose.vps.yml"
            else
              old_compose="$current/docker-compose.vps.yml"
            fi

            if [ -f "$old_compose" ]; then
              rollback=(docker compose --project-name s-health --env-file "$current/.env" -f "$old_compose")
              "${rollback[@]}" up -d --build --remove-orphans || true
            fi

            rm -rf "$release" "$archive"
            echo 'Backend health check failed.' >&2
            exit 1
          fi

          rm -rf "$current.previous"
          mv "$current" "$current.previous"
          mv "$release" "$current"
          rm -rf "$current.previous" "$archive"
          trap - EXIT
          echo "Oracle backend deployed: $RELEASE_SHA"
          REMOTE_SCRIPT

  verify-vps:
    name: Verify API on Oracle VPS
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production

    steps:
      - name: Load Oracle SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

      - name: Configure SSH host key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p 22 -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify local API
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          ssh -p 22 "$ORACLE_USER@$ORACLE_HOST" \
            "curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8086/health >/dev/null"

  verify-public:
    name: Verify public API through Cloudflare
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify public API
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            "$PUBLIC_API_URL/health" >/dev/null
